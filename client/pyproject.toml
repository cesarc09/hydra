[project]
name = "hydra-cli"
version = "0.1.0"
description = "CLI client for Hydra - Claude Code control plane"
requires-python = ">=3.11"
# No runtime dependencies - stdlib only (urllib, json, argparse)

[project.scripts]
hydra = "hydra_cli.__main__:main"

[tool.setuptools.packages.find]
# Package only hydra_cli. client/commands/ (slash-command markdown, deployed by
# setup.sh) is a sibling dir, not a package - without this, setuptools flat-layout
# auto-discovery finds two top-level packages ('commands', 'hydra_cli') and aborts.
include = ["hydra_cli*"]
