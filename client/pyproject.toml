[project]
name = "hydra-cli"
version = "0.1.0"
description = "CLI client for Hydra - Claude Code control plane"
requires-python = ">=3.11"
# No runtime dependencies - stdlib only (urllib, json, argparse)

[project.scripts]
hydra = "hydra_cli.__main__:main"

[tool.setuptools.packages.find]
# Package only hydra_cli. client/skills/ (published by publish_skills.sh) is a sibling
# source dir, not a package; unrestricted flat-layout discovery would include it.
include = ["hydra_cli*"]
